\* Ingest clean configuration (3.1 scope: 2 nodes, RF = 2, 1 partition,
\* 2 windows, 4 requests with DKey(q1) = DKey(q2) -- the normative
\* colliding-dedup-key pin).  Reachable-state count pinned in
\* specs/state-counts.toml; every Brk* switch is FALSE here.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1, 2}
  Requests   = {q1, q2, q3, q4}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 1
  ThrottleLim = 2
  HardLim    = 3
  WipeBudget = 0
  MaxCrashes = 1
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims = {}
  DrainOn    = FALSE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1   q2 = q2   q3 = q3   q4 = q4
  p1 = p1   d1 = d1
  dkA = dkA dkB = dkB dkC = dkC
  ckA = ckA
  WinOf      <- IngestWinOf
  PartOf     <- IngestPartOf
  DKeyOf     <- IngestDKeyOf
  CKeyOf     <- IngestCKeyOf
  TombOf     <- IngestTombOf
  KindOf     <- IngestKindOf
  HomePartition <- IngestHome
  DsOf       <- IngestDsOf
  AcceptorOf <- IngestAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  DurableAck
  NoAckedLoss
  WatermarkHonesty
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
\* WatermarkEventuallyAdvances is vacuous here by construction (DrainOn =
\* FALSE is literally its antecedent); Drain.cfg checks it for real.
PROPERTY
  LadderMonotone
  EveryRequestResolves
