\* Non-vacuity witness (3.6, armed): an EvolveSchema lands mid-flight and a peer applies widen-before-data.
\* This configuration asserts the witness state/step is UNREACHABLE
\* and MUST fail -- the counterexample TLC prints IS the witness.
\* Constants identical to the clean Schema.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1, p2}
  Windows    = {1, 2}
  Requests   = {q1}
  Datasets   = {d1}
  Columns    = {c1, c2}
  RF         = 2
  SoftLim    = 9
  ThrottleLim = 9
  HardLim    = 9
  WipeBudget = 0
  MaxCrashes = 0
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims = {}
  DrainOn    = FALSE
  TakeoverOn = FALSE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1
  p1 = p1   p2 = p2
  d1 = d1
  c1 = c1   c2 = c2
  dkA = dkA
  ckA = ckA
  WinOf      <- SchemaWinOf
  PartOf     <- SchemaPartOf
  DKeyOf     <- SchemaDKeyOf
  CKeyOf     <- SchemaCKeyOf
  TombOf     <- SchemaTombOf
  KindOf     <- SchemaKindOf
  HomePartition <- SchemaHome
  DsOf       <- SchemaDsOf
  AcceptorOf <- SchemaAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  NoWitness_SchemaWidensInFlight
