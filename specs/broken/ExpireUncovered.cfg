\* Broken variant (3.6, armed): Expire drops the covering-snapshot conjunct
\* (BrkExpireUncovered = TRUE).  MUST fail on every run; the
\* perturbation is this configuration -- the .tla adds nothing.
\* Scope: Requests = {q1} -- the smallest request set reaching this
\* counterexample; constants otherwise identical to the clean
\* DrainSnapshot.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1}
  Requests   = {q1}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 5
  ThrottleLim = 5
  HardLim    = 5
  WipeBudget = 0
  MaxCrashes = 0
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims <- DSInitClaims
  DrainOn    = TRUE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1   q4 = q4
  p1 = p1   d1 = d1
  dkA = dkA dkC = dkC
  ckA = ckA
  WinOf      <- DSWinOf
  PartOf     <- DSPartOf
  DKeyOf     <- DSDKeyOf
  CKeyOf     <- DSCKeyOf
