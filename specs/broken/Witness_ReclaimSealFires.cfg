\* Non-vacuity witness (3.6, armed): ReclaimSeal (#177) actually fires.
\* This configuration asserts the witness step is UNREACHABLE and MUST
\* fail -- the counterexample TLC prints IS the witness.
\* Constants identical to the clean Replication.cfg (the smallest scope in
\* which a node's own orphaned seal is reachable).
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1}
  Requests   = {q1}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 5
  ThrottleLim = 5
  HardLim    = 5
  WipeBudget = 0
  MaxCrashes = 1
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims <- ReplicationInitClaims
  DrainOn    = TRUE
  TakeoverOn = TRUE
  ReclaimOn  = TRUE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1
  p1 = p1   d1 = d1
  dkA = dkA
  WinOf      <- ReplicationWinOf
  PartOf     <- ReplicationPartOf
  DKeyOf     <- ReplicationDKeyOf
  CKeyOf     <- ReplicationCKeyOf
  TombOf     <- ReplicationTombOf
  KindOf     <- ReplicationKindOf
  HomePartition <- ReplicationHome
  DsOf       <- ReplicationDsOf
  AcceptorOf <- ReplicationAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
PROPERTY
  NoWitness_ReclaimSealFires
