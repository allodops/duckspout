\* Non-vacuity witness (3.6, armed): the crash window between LakeCommitOk and Demote, recovered through.
\* This configuration asserts the witness state/step is UNREACHABLE
\* and MUST fail -- the counterexample TLC prints IS the witness.
\* Overrides vs the clean Drain.cfg: MaxCrashes = 1; Requests   = {q1}; -- the smallest scope the
\* witness needs; constants otherwise identical.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2, n3}
  Partitions = {p1}
  Windows    = {1}
  Requests   = {q1}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 5
  ThrottleLim = 5
  HardLim    = 5
  WipeBudget = 0
  MaxCrashes = 1
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {n1}
  InitClaims <- DrainInitClaims
  DrainOn    = TRUE
  TakeoverOn = FALSE
  ReclaimOn = FALSE
  None       = None
  n1 = n1   n2 = n2   n3 = n3
  q1 = q1   q2 = q2   q4 = q4
  p1 = p1   d1 = d1
  dkA = dkA dkC = dkC
  ckA = ckA
  WinOf      <- DrainWinOf
  PartOf     <- DrainPartOf
  DKeyOf     <- DrainDKeyOf
  CKeyOf     <- DrainCKeyOf
  TombOf     <- DrainTombOf
  KindOf     <- DrainKindOf
  HomePartition <- DrainHome
  DsOf       <- DrainDsOf
  AcceptorOf <- DrainAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  NoWitness_CrashBetweenCommitAndDemote
