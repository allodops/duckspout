\* Replication clean configuration (see Replication.tla's header: 2 nodes,
\* RF = 2, 1 event-class partition, 1 window, 1 request, MaxCrashes = 1,
\* Crashable = {n1}, TakeoverOn = TRUE -- the smallest scope in which
\* takeover is not vacuous). ReclaimOn = TRUE (#177): this is also the
\* smallest scope in which a node's own orphaned seal (sealed+PUT, crashed
\* before commit, recovered) is reachable -- see the WatermarkEventuallyAdvances
\* comment below. Reachable-state count pinned in specs/state-counts.toml;
\* every Brk* switch is FALSE here.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1}
  Requests   = {q1}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 5
  ThrottleLim = 5
  HardLim    = 5
  WipeBudget = 0
  MaxCrashes = 1
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims <- ReplicationInitClaims
  DrainOn    = TRUE
  TakeoverOn = TRUE
  ReclaimOn  = TRUE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1
  p1 = p1   d1 = d1
  dkA = dkA
  WinOf      <- ReplicationWinOf
  PartOf     <- ReplicationPartOf
  DKeyOf     <- ReplicationDKeyOf
  CKeyOf     <- ReplicationCKeyOf
  TombOf     <- ReplicationTombOf
  KindOf     <- ReplicationKindOf
  HomePartition <- ReplicationHome
  DsOf       <- ReplicationDsOf
  AcceptorOf <- ReplicationAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  DurableAck
  NoAckedLoss
  WatermarkHonesty
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
PROPERTY
  LadderMonotone
  EveryRequestResolves
  WatermarkEventuallyAdvances
\* WatermarkEventuallyAdvances (#177): TLC used to falsify this in this exact
\* scope -- a node sealed+PUT an object, crashed before committing it, then
\* recovered; its incarnation bumped, permanently fencing its own commit per
\* CommitGuardsHold, and no other node could commit or reseal it either
\* since the recovered node never lost its live claim long enough for
\* Takeover to fire. ReclaimSeal (ReclaimOn = TRUE above) closes exactly
\* that gap: the recovering sealer re-registers its own orphaned
\* sealedParts/objects entry under its current incarnation before
\* attempting to commit it, so LakeCommitOk's inc fence no longer blocks it
\* forever. The ORIGINAL bug shape (no reclaim available) is still
\* permanently red on purpose, unmodified in its own dedicated scope:
\* specs/broken/Finding_TakeoverOrphanedSeal.cfg pins ReclaimOn = FALSE and
\* must keep falsifying this same property. The reclaim mechanism itself is
\* witnessed non-vacuous (it genuinely fires, not dead code) at
\* specs/broken/Witness_ReclaimSealFires.cfg.
