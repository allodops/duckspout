\* Replication clean configuration (see Replication.tla's header: 2 nodes,
\* RF = 2, 1 event-class partition, 1 window, 1 request, MaxCrashes = 1,
\* Crashable = {n1}, TakeoverOn = TRUE -- the smallest scope in which
\* takeover is not vacuous). Reachable-state count pinned in
\* specs/state-counts.toml; every Brk* switch is FALSE here.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1}
  Requests   = {q1}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 5
  ThrottleLim = 5
  HardLim    = 5
  WipeBudget = 0
  MaxCrashes = 1
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims <- ReplicationInitClaims
  DrainOn    = TRUE
  TakeoverOn = TRUE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1
  p1 = p1   d1 = d1
  dkA = dkA
  WinOf      <- ReplicationWinOf
  PartOf     <- ReplicationPartOf
  DKeyOf     <- ReplicationDKeyOf
  CKeyOf     <- ReplicationCKeyOf
  TombOf     <- ReplicationTombOf
  KindOf     <- ReplicationKindOf
  HomePartition <- ReplicationHome
  DsOf       <- ReplicationDsOf
  AcceptorOf <- ReplicationAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  DurableAck
  NoAckedLoss
  WatermarkHonesty
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
PROPERTY
  LadderMonotone
  EveryRequestResolves
\* WatermarkEventuallyAdvances is NOT checked here: TLC falsifies it in
\* this scope (a node sealed+PUT an object, crashed before committing it,
\* then recovered -- its incarnation bumped, permanently fencing its own
\* commit per CommitGuardsHold, and no other node can commit or reseal it
\* either since the recovered node never lost its live claim long enough
\* for Takeover to fire). Confirmed as a permanently-red finding, not a
\* silently-dropped check: specs/broken/Finding_TakeoverOrphanedSeal.cfg.
