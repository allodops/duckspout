\* Schema clean configuration (3.1 scope: 2 nodes, RF = 2, 2 partitions,
\* 2 datasets homed on p1 with data on p2, lattice = SUBSET {c1, c2} -- a
\* 3-chain plus its join sibling).  Reachable-state count pinned in
\* specs/state-counts.toml; every Brk* switch is FALSE here.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1, p2}
  Windows    = {1, 2}
  Requests   = {q1}
  Datasets   = {d1}
  Columns    = {c1, c2}
  RF         = 2
  SoftLim    = 9
  ThrottleLim = 9
  HardLim    = 9
  WipeBudget = 0
  MaxCrashes = 0
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims = {}
  DrainOn    = FALSE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1
  p1 = p1   p2 = p2
  d1 = d1
  c1 = c1   c2 = c2
  dkA = dkA
  ckA = ckA
  WinOf      <- SchemaWinOf
  PartOf     <- SchemaPartOf
  DKeyOf     <- SchemaDKeyOf
  CKeyOf     <- SchemaCKeyOf
  TombOf     <- SchemaTombOf
  KindOf     <- SchemaKindOf
  HomePartition <- SchemaHome
  DsOf       <- SchemaDsOf
  AcceptorOf <- SchemaAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  DurableAck
  NoAckedLoss
  WatermarkHonesty
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
  SchemaConvergence
PROPERTY
  LadderMonotone
  SchemaMonotone
  EveryRequestResolves
  WatermarkEventuallyAdvances
