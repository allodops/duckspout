\* Simulation-tier configuration (nightly cadence; ledger row tla-sim,
\* issue #48) for DrainSnapshot.tla's changelog scope.  TN-35: this scope's
\* exhaustive space measured past 2.5M states with TLC's queue still
\* growing -- beyond the per-PR bounded-tier budget (8.1) -- so NO clean
\* specs/DrainSnapshot.cfg exists: a root cfg would enter `just tla-mc`
\* discovery, which pins exact reachable-state counts this scope cannot
\* have.  Sim-only scopes live under specs/sim/ instead (scripts/tla.mjs).
\*
\* Constants: exactly the module header's shape -- 2 nodes, RF = 2, one
\* changelog partition, ONE window, requests {q1, q4} sharing client key
\* ckA with q4 a tombstone, single drainer n2 (DSInitClaims).  Identical to
\* broken/ExpireUncovered.cfg except Requests (the full {q1, q4} here, so
\* the fold genuinely deletes and re-folds) and BrkExpireUncovered = FALSE.
\* Checks the 10 safety invariants + LadderMonotone + EveryRequestResolves
\* + WatermarkEventuallyAdvances; the armed broken sibling for this scope
\* stays broken/ExpireUncovered.cfg, run by `just tla-mc` on every PR.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1}
  Requests   = {q1, q4}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 5
  ThrottleLim = 5
  HardLim    = 5
  WipeBudget = 0
  MaxCrashes = 0
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims <- DSInitClaims
  DrainOn    = TRUE
  TakeoverOn = FALSE
  ReclaimOn = FALSE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1   q4 = q4
  p1 = p1   d1 = d1
  dkA = dkA dkC = dkC
  ckA = ckA
  WinOf      <- DSWinOf
  PartOf     <- DSPartOf
  DKeyOf     <- DSDKeyOf
  CKeyOf     <- DSCKeyOf
  TombOf     <- DSTombOf
  KindOf     <- DSKindOf
  HomePartition <- DSHome
  DsOf       <- DSDsOf
  AcceptorOf <- DSAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  DurableAck
  NoAckedLoss
  WatermarkHonesty
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
PROPERTY
  LadderMonotone
  EveryRequestResolves
  WatermarkEventuallyAdvances
