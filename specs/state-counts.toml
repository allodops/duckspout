# Pinned exact reachable-state counts per clean configuration (3.1; docs/
# verification.md 8.1): `just tla-mc <Module>` fails on any drift -- a state
# space that silently changed is a model that silently stopped exploring
# something.  Every number below was produced by an actual TLC run of the
# committed clean .cfg on this repository's pinned tla2tools ("N distinct
# states found"); update it only together with the model change that moves
# it, and say why in the PR.  Measured on Temurin 17 (CI provides 21; the
# reachable-state count is JVM-independent -- it is a property of the model,
# not the runtime).

# Ingest.cfg -- 2 nodes, RF=2, 1 partition, 2 windows, 4 requests with
# DKey(q1)=DKey(q2) (the normative colliding-dedup-key pin), MaxCrashes=1;
# all 10 safety invariants + LadderMonotone + EveryRequestResolves.  41m12s.
Ingest = 232052

# Drain.cfg -- 3 nodes, RF=2, 1 event-class partition, 1 window, 1 request,
# two-drainer pinned claim set, IndetOn={n1}; all 10 safety invariants +
# LadderMonotone + EveryRequestResolves + WatermarkEventuallyAdvances.
# 38m05s.
Drain = 398526

# Schema.cfg -- 2 nodes, RF=2, 2 partitions (data on p2, dataset home p1),
# 1 dataset, lattice SUBSET{c1,c2}, 1 data request, MaxCrashes=0; all 10
# safety invariants + SchemaConvergence + LadderMonotone + SchemaMonotone
# + EveryRequestResolves.  09m09s.
Schema = 36191

# Replication.cfg -- 2 nodes, RF=2, 1 event-class partition, 1 window,
# 1 request, MaxCrashes=1, Crashable={n1}, TakeoverOn=TRUE (#55),
# ReclaimOn=TRUE (#177); all 10 safety invariants + LadderMonotone +
# EveryRequestResolves + WatermarkEventuallyAdvances (now checked and
# holds: DuckSpoutCore's ReclaimSeal action, gated by ReclaimOn, lets a
# recovering node re-register its own orphaned sealedParts/objects entry
# under its current incarnation, closing the liveness gap
# specs/broken/Finding_TakeoverOrphanedSeal.cfg still documents with
# ReclaimOn=FALSE). Count moved 171070 -> 171972 (+902) versus the
# pre-#177 baseline solely because ReclaimSeal adds new reachable states
# (the same sealedParts/objects part re-keyed under a bumped incarnation)
# in the one crash-then-recover branch that can reach it; re-verified
# 07m39s.
Replication = 171972
