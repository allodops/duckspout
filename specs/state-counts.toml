# Pinned exact reachable-state counts per clean configuration (3.1; docs/
# verification.md 8.1): `just tla-mc <Module>` fails on any drift -- a state
# space that silently changed is a model that silently stopped exploring
# something.  Every number below was produced by an actual TLC run of the
# committed clean .cfg on this repository's pinned tla2tools ("N distinct
# states found"); update it only together with the model change that moves
# it, and say why in the PR.  Measured on Temurin 17 (CI provides 21; the
# reachable-state count is JVM-independent -- it is a property of the model,
# not the runtime).

