\* Drain clean configuration (see Drain.tla's header: 3 nodes, RF = 2,
\* one event-class partition, one window, ONE request -- the largest
\* full-pipeline scope TLC can exhaust with liveness; the divergence,
\* dedup and changelog hazards are armed at their own scopes by the
\* broken/ configurations and DrainSnapshot.cfg).  Reachable-state count
\* pinned in specs/state-counts.toml; every Brk* switch is FALSE here.
SPECIFICATION Spec
CONSTANTS
  Nodes      = {n1, n2, n3}
  Partitions = {p1}
  Windows    = {1}
  Requests   = {q1}   \* q2, q4 stay bound below: the broken/ scopes
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 5
  ThrottleLim = 5
  HardLim    = 5
  WipeBudget = 0
  MaxCrashes = 0
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {n1}
  InitClaims <- DrainInitClaims
  DrainOn    = TRUE
  None       = None
  n1 = n1   n2 = n2   n3 = n3
  q1 = q1   q2 = q2   q4 = q4
  p1 = p1   d1 = d1
  dkA = dkA dkC = dkC
  ckA = ckA
  WinOf      <- DrainWinOf
  PartOf     <- DrainPartOf
  DKeyOf     <- DrainDKeyOf
  CKeyOf     <- DrainCKeyOf
  TombOf     <- DrainTombOf
  KindOf     <- DrainKindOf
  HomePartition <- DrainHome
  DsOf       <- DrainDsOf
  AcceptorOf <- DrainAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
INVARIANT
  DurableAck
  NoAckedLoss
  WatermarkHonesty
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
PROPERTY
  LadderMonotone
  EveryRequestResolves
  WatermarkEventuallyAdvances
