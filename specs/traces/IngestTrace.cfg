\* IngestTrace refinement configuration (3.7, 8.2).  NOT a clean
\* model-checking config: it constrains Next to one recorded NDJSON run
\* (TRACE_PATH), so there is no pinned state count and no broken/ sweep --
\* its teeth are the doctored fixtures under specs/fixtures/ (runner:
\* scripts/trace-conformance.mjs).  Scope rationale -- Nodes = {n1, n2} at
\* RF = 1, distinct dedup keys, MaxCrashes = 0 -- is argued in the module
\* header (the config must accept traces of the v0.1 implementation).
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1, 2}
  Requests   = {q1, q2, q3, q4, q5}
  Datasets   = {d1}
  Columns    = {}
  RF         = 1
  SoftLim    = 9
  ThrottleLim = 9
  HardLim    = 9
  WipeBudget = 0
  MaxCrashes = 0
  MaxHb      = 0
  Crashable  = {}
  IndetOn    = {}
  InitClaims <- TraceInitClaims
  DrainOn    = TRUE
  TakeoverOn = FALSE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1   q2 = q2   q3 = q3   q4 = q4   q5 = q5
  p1 = p1   d1 = d1
  dkA = dkA dkB = dkB dkC = dkC dkD = dkD
  ckA = ckA
  WinOf      <- TraceWinOf
  PartOf     <- TracePartOf
  DKeyOf     <- TraceDKeyOf
  CKeyOf     <- TraceCKeyOf
  TombOf     <- TraceTombOf
  KindOf     <- TraceKindOf
  HomePartition <- TraceHome
  DsOf       <- TraceDsOf
  AcceptorOf <- TraceAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
\* WatermarkHonesty is deliberately absent from this list: at RF = 1 there
\* are no receipts, so NewWatermark's extent criterion cannot see a second
\* holder's acked row and the invariant is unsatisfiable on exactly the
\* TN-32 residue family this fixture set exists to arm (issue #141).  The
\* invariant is armed by the clean configs (Ingest.cfg, Drain.cfg at
\* RF = 2) and returns to the trace tier with the v0.2 receipted traces
\* (Replication.tla; ledger row tla-mc-replication).
INVARIANT
  DurableAck
  NoAckedLoss
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
  TraceComplete
POSTCONDITION
  TraceAccepted
