\* ReplicationTrace refinement configuration (3.7, 8.2).  NOT a clean
\* model-checking config: it constrains Next to one recorded NDJSON run
\* (TRACE_PATH), so there is no pinned state count and no broken/ sweep --
\* its teeth are the doctored fixtures under specs/fixtures/ (runner:
\* scripts/trace-conformance.mjs).  Scope rationale -- Nodes = {n1, n2} at
\* RF = 2, two same-origin requests with distinct dedup keys, MaxCrashes = 1
\* -- is argued in the module header (the config must accept traces of the
\* implementation it targets; see also Replication.tla's own header for why
\* this exact scope is the smallest one in which takeover is not vacuous).
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes      = {n1, n2}
  Partitions = {p1}
  Windows    = {1, 2}
  Requests   = {q1, q2, q3}
  Datasets   = {d1}
  Columns    = {}
  RF         = 2
  SoftLim    = 9
  ThrottleLim = 9
  HardLim    = 9
  WipeBudget = 0
  MaxCrashes = 1
  MaxHb      = 0
  Crashable  = {n1}
  IndetOn    = {}
  InitClaims <- TraceInitClaims
  DrainOn    = TRUE
  TakeoverOn = TRUE
  ReclaimOn  = FALSE
  None       = None
  n1 = n1   n2 = n2
  q1 = q1   q2 = q2   q3 = q3
  p1 = p1   d1 = d1
  dkA = dkA dkB = dkB dkC = dkC
  ckA = ckA
  WinOf      <- TraceWinOf
  PartOf     <- TracePartOf
  DKeyOf     <- TraceDKeyOf
  CKeyOf     <- TraceCKeyOf
  TombOf     <- TraceTombOf
  KindOf     <- TraceKindOf
  HomePartition <- TraceHome
  DsOf       <- TraceDsOf
  AcceptorOf <- TraceAcceptorOf
  BrkAckBeforeReceipt      = FALSE
  BrkDrainWithoutWatermark = FALSE
  BrkEvictStaging          = FALSE
  BrkWatermarkPastHole     = FALSE
  BrkDemoteDirty           = FALSE
  BrkDoubleDrain           = FALSE
  BrkSupplementOverlap     = FALSE
  BrkExpireUncovered       = FALSE
  BrkLadderInversion       = FALSE
\* Unlike IngestTrace.cfg (RF = 1, no receipts ever journaled there),
\* WatermarkHonesty IS included: RF = 2 means real Receipts are journaled
\* and NewWatermark's extent criterion has a second holder's acked row to
\* see, exactly the gap IngestTrace.tla's header documented as deferred
\* "to the trace tier with the v0.2 receipted traces".
INVARIANT
  DurableAck
  NoAckedLoss
  WatermarkHonesty
  CacheTransparency
  GapFreedom
  SingleDrainCommit
  FencedZombie
  LossLedgerTruthful
  SnapshotCovered
  LatestViewCorrect
  TraceComplete
POSTCONDITION
  TraceAccepted
