# DuckSpout virtual workspace root (SEED s§3.1).
# No root package; every member lives under crates/. spike/ was quarantined
# here (D-11) and deleted at v0.1 once #35/#36 superseded it (issue #122).

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/allodops/duckspout"

# Single source of version truth (SEED s§3.1): members depend with
# `workspace = true` only; a direct version string in a member manifest is an
# invariants violation.
[workspace.dependencies]
# --- the dependency triangle (SEED s§3.2; compat-matrix.toml row 1; moves atomically) ---
duckdb = { version = "1.10505", features = ["bundled"] }
arrow = "58"
arrow-flight = "58"
parquet = "58"
tonic = "0.14"
# tonic's own google.rpc details companion (RetryInfo riding UNAVAILABLE,
# §4.5) — same project, same 0.14 line; no in-house candidate
# (R-third-party-first).
tonic-types = "0.14"
prost = "0.14"
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic",
    "trace",
    "logs",
    "metrics",
] }
# --- remaining stack picks (SEED s§3.3) ---
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
# futures: stream combinators for the daemon's Flight serving surface
# (arrow-flight's encoder emits futures streams); the ecosystem-standard
# companion, no in-house candidate (R-third-party-first).
futures = "0.3"
object_store = "0.14"
config = "0.15"
thiserror = "2"
anyhow = "1"
proptest = "1"
proptest-state-machine = "0.8"
loom = "0.7"
crc32fast = "1"
# §4.4.1's content-hash dedup key needs a collision-resistant hash (a 32-bit
# checksum at 100k entries would collide constantly); sha2 is the boring
# RustCrypto standard, no in-house candidate (R-third-party-first).
sha2 = "0.10"
# dev-only: unique on-disk fixtures for the staging engine's real-DuckDB
# tests (issue #31); the de-facto standard, no in-house candidate
# (R-third-party-first).
tempfile = "3"
# dev-only: wraps a test-local loopback TcpListener into the stream shape
# tonic's serve_with_incoming takes (issue #32's in-process gRPC tests);
# tokio's own ecosystem companion, no in-house candidate
# (R-third-party-first).
tokio-stream = { version = "0.1", features = ["net"] }
bytes = "1"
# The daemon's composition root only (§10.1): the `hot.max_bytes` §9.6.1
# default ("75% of volume at startup") needs the hot volume's total
# capacity. Every crate in this workspace commits to
# `#![forbid(unsafe_code)]`, so a raw `statvfs` FFI call is not an option
# here — `fs4` is the safe, cross-platform wrapper (no in-house candidate
# for a safe disk-capacity read, R-third-party-first).
fs4 = "0.9"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# dev-only: deterministic instruction-count benchmarking (§8.6, ADR-0005) —
# per-PR gate `instr-gate` (issue #46). Wraps Valgrind's Callgrind, so the
# ci.yml job installs `valgrind` alongside the pinned `iai-callgrind-runner`
# binary (exact version match required, per iai-callgrind's own docs).
iai-callgrind = "=0.16.1"
# --- internal crates (lockstep 0.0.1, SEED D-13) ---
duckspout-types = { path = "crates/duckspout-types", version = "0.0.1" }
duckspout-accept = { path = "crates/duckspout-accept", version = "0.0.1" }
duckspout-staging = { path = "crates/duckspout-staging", version = "0.0.1" }
duckspout-replication = { path = "crates/duckspout-replication", version = "0.0.1" }
duckspout-drain = { path = "crates/duckspout-drain", version = "0.0.1" }
duckspout-watermark = { path = "crates/duckspout-watermark", version = "0.0.1" }
duckspout-lake-contract = { path = "crates/duckspout-lake-contract", version = "0.0.1" }
duckspout-lake-ducklake = { path = "crates/duckspout-lake-ducklake", version = "0.0.1" }
duckspout-ctk = { path = "crates/duckspout-ctk", version = "0.0.1" }
duckspout-daemon = { path = "crates/duckspout-daemon", version = "0.0.1" }
duckspout-ctl = { path = "crates/duckspout-ctl", version = "0.0.1" }
duckspout-fleet = { path = "crates/duckspout-fleet", version = "0.0.1" }
duckspout-judge = { path = "crates/duckspout-judge", version = "0.0.1" }
duckspout-loadgen = { path = "crates/duckspout-loadgen", version = "0.0.1" }

[workspace.lints.rust]
# FFI-adjacent modules may `allow` with a `# SAFETY:` justification; the
# invariant engine flags undocumented allows (SEED s§3.1).
unsafe_code = "deny"
# Ratchet to deny later — arming-ledger row (SEED s§3.1).
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
