# Explicit defaults (SEED s§2): rustfmt's stable defaults, stated rather than
# implied, so a rustfmt default-shift shows up as a diff here and not as churn.
edition = "2024"
style_edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
match_arm_leading_pipes = "Never"
fn_params_layout = "Tall"
