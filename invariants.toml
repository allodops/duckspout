# --- banned files ---

[[banned-file]]
glob = "**/*.sh"
reason = "no bash, ever; Bun mjs under scripts/ (CONSTITUTION, D-7) — applies repo-wide, spike/ included"

[[banned-file]]
glob = "**/*.bash"
reason = "same"

# --- banned source patterns ---

[[banned-source]]
scope = "crates/duckspout-{accept,staging,replication,drain,watermark}/src/**"
patterns = ["tokio::net", "Instant::now", "SystemTime::now", "thread_rng", "std::process"]
reason = "D-2: determinism through ports; protocol crates spawn nothing"

# Encodes the s§7 "every crate → spike" forbidden edges (see header): spike is
# not a cargo dependency target, so ban the word at the manifest level.
[[banned-source]]
scope = "crates/**/Cargo.toml"
patterns = ["spike"]
reason = "D-11: spike/ is quarantined; no workspace crate may reference it"

# --- golden manifests ---

[[golden-manifest]]
generate = "cargo run -q -p duckspout-daemon -- --dump-config-manifest"
golden = "floors/config-surface.toml"
reason = "§9.6.4 config-surface ratchet: 32 settings; additions are loud diffs"

# --- pairing rules (each kind is implemented in the engine; s§7) ---

[[pairing]]
kind = "constitution-mechanism"   # every CONSTITUTION.md rule ID has a non-empty
                                  # Mechanism cell (armed CI job / invariants rule /
                                  # CODEOWNERS path / staged ledger row — s§8.2)

[[pairing]]
kind = "trace-mapping"            # every trace-enum variant ↔ a docs/trace-mapping.md row

[[pairing]]
kind = "ledger-integrity"         # the s§6.5 ledger invariants (armed⇒job+recipe exist;
                                  # staged⇒milestone, +issue>0 when bootstrap=false [CI-only])

[[pairing]]
kind = "tool-pins"                # every version mirror ↔ its authoritative copy (Appendix A)

[[pairing]]
kind = "edge-audit-domain"        # every workspace crate appears in the forbidden-edge
                                  # domain — a new crate cannot silently join unaudited

[[pairing]]
kind = "workspace-inheritance"    # every member inherits every [workspace.package] field
