# Rule data for scripts/check-invariants.mjs (SEED s§7, D-7, ADR-0007).
# Rules are DATA: the engine knows five rule kinds — forbidden-edge,
# banned-file, banned-source, golden-manifest, pairing — and hardcodes no
# specific edge, glob, or pattern.
#
# --- forbidden edges (82; finite and hand-enumerated per s§7 — nothing
# --- generates them at check time). One [[forbidden-edge]] table each:
#   1. every protocol×protocol pair, both directions (20) — ADR-0008
#   2. every protocol crate → each concrete impl/bin crate (35) — §10.1
#   3. every protocol crate except drain → duckspout-lake-contract (4) — s§4
#   4. duckspout-types → every other workspace crate (13) — §10.1
#   5. every non-bin crate → anyhow (10) — s§3.3
# The seed listing's item 4 "every crate → spike" is encoded below as a
# banned-source rule over crates/**/Cargo.toml instead of pseudo-edges:
# spike is workspace-excluded (D-11), so it can never appear in `cargo
# metadata` as a dependency edge — the only way a crate could reach it is a
# path dependency, which the manifest-text ban catches directly.

[[forbidden-edge]]
from = "duckspout-accept"
to = "duckspout-staging"
reason = "ADR-0008: all shared ports live in duckspout-types; no protocol×protocol crate edges"

