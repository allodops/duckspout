# Machine-readable gate ledger (SEED s§6.5) — the one source for "what is
# armed". Parsed by scripts/lib/proc.mjs (`just ci` runs armed cadence="pr"
# rows in this file's order) and by scripts/check-invariants.mjs (the
# ledger-integrity pairing rule).
#
# Row schema: id (unique), status ("armed"|"staged"), cadence ("pr"|"nightly"),
# recipe (Justfile recipe), workflow_job (required when armed), milestone
# (required when staged), issue (tracking issue; must be > 0 once
# bootstrap = false — enforced CI-only, s§6.5), spec (citation; §n =
# DUCKSPOUT.md, s§n = docs/seed.md).

# Flipped to false by SEED s§11 step 5's ledger-filling PR (protected-set,
# human-clicked); until then the issue > 0 sub-check is dormant.
bootstrap = false

# --- armed, cadence = "pr" (the `just ci` sequence, in order) ---

