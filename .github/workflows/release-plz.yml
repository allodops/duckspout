# release-plz.yml — release-plz in DRY-RUN at seed (SEED s§6.4; D-13).
#
# The action's `dry_run` input applies to the `release` command only (its
# release-pr command has no dry-run form), so the doc-faithful dry-run is
# `command: release` + `dry_run: true`: it reports what would be released and
# publishes nothing. Real releases (and crates.io Trusted Publishing, D-13)
# arrive when publishing starts, by protected-set PR.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # release-plz reads tag/commit history

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: release-plz release --dry-run
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
