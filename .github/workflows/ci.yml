# ci.yml — the armed mechanical gates (SEED s§6.1).
#
# Every job body after setup is `just <recipe>`: the chain is
# GHA → just → scripts (SEED s§5). No `paths:` filters, ever (ADR-0006).
#
# Staged gates (conformance, coverage-floor, instr-gate, smoke) are
# deliberately NOT jobs here — a permanently-red or skipped-green job would
# poison the loop. Each lives as a staged row in docs/arming-ledger.toml with
# a milestone and tracking issue; arming one = add its job block + its ci-ok
# `needs:` entry + flip its ledger row, in one protected-set PR (SEED s§6.1).
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PRs only; merge_group and main pushes always
# run to completion (SEED s§6).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just fmt-check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just clippy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just test-all

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just deny
      - run: just machete

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just doc

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just invariants

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          msrv-toolchain: "1.96"
      - run: just msrv

  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just pr-title-check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just workflows

  # §8.1's per-PR bounded TLC tier (ledger row tla-mc-core). Latency is
  # managed by the parallel per-module fan-out and the jar cache — never by
  # paths-filters or nightly demotion (ADR-0006). Each leg model-checks one
  # module against its pinned reachable-state count; `just tla-mc <Module>`
  # also runs the whole specs/broken/ must-fail suite, so the tier's teeth
  # (broken variants, witnesses, FINDINGS) travel with every leg.
  tla-mc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # every leg reports — a red leg must not mask another
      matrix:
        module: [Ingest, Drain, Schema]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # scripts/tla.mjs is the authoritative jar pin (URL + SHA-256), so its
      # hash keys the cache; `just tla-install` re-verifies the digests even
      # on a cache hit before trusting the jars.
      - name: Cache the TLA+ jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: specs/.tools
          key: tla-jars-${{ hashFiles('scripts/tla.mjs') }}
      - run: just tla-install
      - env:
          MODULE: ${{ matrix.module }}
        run: just tla-mc "$MODULE"

  # Fan-in: the single required mechanical check (SEED s§6.1). `if: always()`
  # so it runs even when a need fails; the step then fails unless every need
  # succeeded — a cancelled or skipped need is a failure, never a pass.
  ci-ok:
    needs: [fmt, clippy, test, deny, docs, invariants, msrv, workflows, pr-title, tla-mc]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All armed gates green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
          echo "ci-ok: every armed gate is green"
