# ci.yml — the armed mechanical gates (SEED s§6.1).
#
# Every job body after setup is `just <recipe>`: the chain is
# GHA → just → scripts (SEED s§5). No `paths:` filters, ever (ADR-0006).
#
# Staged gates (smoke) are deliberately NOT jobs here — a permanently-red
# or skipped-green job would poison the loop. Each lives as a staged row in
# docs/arming-ledger.toml with a milestone and tracking issue; arming one =
# add its job block + its ci-ok `needs:` entry + flip its ledger row, in one
# protected-set PR (SEED s§6.1). conformance was armed by the #44 arming
# PR; coverage-floor by the #45 arming PR; instr-gate by the #46 arming PR.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PRs only; merge_group and main pushes always
# run to completion (SEED s§6).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just fmt-check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just clippy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just test-all

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just deny
      - run: just machete

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just doc

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just invariants

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          msrv-toolchain: "1.96"
      - run: just msrv

  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just pr-title-check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just workflows

  # §8.1's per-PR bounded TLC tier (ledger row tla-mc-core). Latency is
  # managed by the parallel per-module fan-out and the jar cache — never by
  # paths-filters or nightly demotion (ADR-0006). Each leg model-checks one
  # module against its pinned reachable-state count; `just tla-mc <Module>`
  # also runs the whole specs/broken/ must-fail suite, so the tier's teeth
  # (broken variants, witnesses, FINDINGS) travel with every leg.
  tla-mc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # every leg reports — a red leg must not mask another
      matrix:
        module: [Ingest, Drain, Schema]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # scripts/tla.mjs is the authoritative jar pin (URL + SHA-256), so its
      # hash keys the cache; `just tla-install` re-verifies the digests even
      # on a cache hit before trusting the jars.
      - name: Cache the TLA+ jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: specs/.tools
          key: tla-jars-${{ hashFiles('scripts/tla.mjs') }}
      - run: just tla-install
      - env:
          MODULE: ${{ matrix.module }}
        run: just tla-mc "$MODULE"

  # §8.2's trace-conformance gate (ledger row `conformance`, armed by issue
  # #44): real MinIO + Postgres, the same images/credentials as
  # deploy/compose/compose.yaml's dev-only conformance backends — an
  # endpoint absent is a fail, never a skip (§8.2, s§5.1). MinIO is started
  # by hand (`docker run`, not the `services:` block) because it needs the
  # `server /data …` command override GH Actions' service-container config
  # has no field for; Postgres's default image CMD already starts the
  # server, so it is an ordinary service container. `just conformance` runs
  # all three tiers (fixtures, live, real backends) for real.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: duckspout
          # Dev/CI-only credential for a loopback-bound container; never a
          # production value (secrets are file paths, §9.5).
          POSTGRES_PASSWORD: duckspout-dev
          POSTGRES_DB: duckspout_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duckspout -d duckspout_catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `just conformance` runs `tla.mjs tv` (fixtures, live, and
      # real-backend tiers all refine through it) — same cache + install
      # pattern as the tla-mc job above; without this the jars are absent
      # and every tier fails in under a second, misreported by the generic
      # "failed refinement (exit 1)" branch as if TLC had actually run.
      - name: Cache the TLA+ jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: specs/.tools
          key: tla-jars-${{ hashFiles('scripts/tla.mjs') }}
      - run: just tla-install
      - name: Start MinIO (dev/CI-only conformance backend)
        run: |
          docker run -d --name duckspout-minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=duckspout \
            -e MINIO_ROOT_PASSWORD=duckspout-dev \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data --console-address ":9001"
          until docker exec duckspout-minio mc ready local; do sleep 2; done
      - name: Create the conformance MinIO bucket
        # The bundled `mc`'s implicit `local` alias (the same convenience
        # `mc ready local` above and the image's own healthcheck in
        # compose.yaml use) has no credentials for mutating calls — `mc mb`
        # needs an authenticated alias, supplied here via `mc`'s documented
        # MC_HOST_<alias> env-var form rather than a persisted `mc alias
        # set` (nothing else in this container needs the credential to
        # survive the step).
        run: docker exec -e MC_HOST_local=http://duckspout:duckspout-dev@127.0.0.1:9000 duckspout-minio mc mb --ignore-existing local/duckspout-conformance
      - env:
          DUCKSPOUT_CONFORMANCE_S3_ENDPOINT: 127.0.0.1:9000
          DUCKSPOUT_CONFORMANCE_S3_BUCKET: duckspout-conformance
          DUCKSPOUT_CONFORMANCE_S3_ACCESS_KEY_ID: duckspout
          DUCKSPOUT_CONFORMANCE_S3_SECRET_ACCESS_KEY: duckspout-dev
          DUCKSPOUT_CONFORMANCE_POSTGRES_DSN: "postgres:dbname=duckspout_catalog host=127.0.0.1 port=5432 user=duckspout password=duckspout-dev"
        run: just conformance

  # §8.6's coverage floor (ledger row `coverage-floor`, armed by issue #45):
  # `cargo-llvm-cov` recomputes line coverage over the whole workspace and
  # `just coverage` (scripts/floors.mjs) compares it against the checked-in
  # floor in floors/coverage-floor.toml — never a cached or PR-claimed
  # number (§8.6's CI-recomputes-never-trusts posture).
  coverage-floor:
    runs-on: ubuntu-latest
    # A cold coverage-instrumented full-workspace build compiles under
    # different rustc flags than the `test` job's own cache entry, so it
    # cannot ride that cache; budgeted like tla-mc's own heaviest-gate
    # allowance rather than the other jobs' 45 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just coverage

  # §8.6's per-PR deterministic instruction-count gate (ledger row
  # instr-gate, ADR-0005, issue #46): iai-callgrind over the ack-path hot
  # functions (§4.3 — Accept's decode step, staging's StageCommit step),
  # gated at baseline +15%. `instr-gate: "true"` on the setup action installs
  # iai-callgrind-runner + valgrind only for this job (Appendix A: staged
  # tools are not installed for jobs that don't need them).
  instr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          instr-gate: "true"
      - run: just instr-gate

  # Fan-in: the single required mechanical check (SEED s§6.1). `if: always()`
  # so it runs even when a need fails; the step then fails unless every need
  # succeeded — a cancelled or skipped need is a failure, never a pass.
  ci-ok:
    needs:
      [
        fmt,
        clippy,
        test,
        deny,
        docs,
        invariants,
        msrv,
        workflows,
        pr-title,
        tla-mc,
        conformance,
        coverage-floor,
        instr-gate,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All armed gates green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
          echo "ci-ok: every armed gate is green"
