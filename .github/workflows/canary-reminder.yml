# canary-reminder.yml — the recurrence mechanism the canary discipline needs
# (SEED s§6.4, s§9.3).
#
# github.token is fine here: creating an issue needs to trigger no other
# workflow. The issue is assigned to the repo owner; the canaries themselves
# are authored OUT-OF-BAND by the owner — blind discipline means no repo
# automation may know a canary window is open. Canaries prove the
# MECHANICAL gates bite (ACPR is session-level judgment, not a CI gate).
name: Canary reminder

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *" # quarterly: 09:00 UTC, 1st of Jan/Apr/Jul/Oct

permissions:
  contents: read

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the quarterly canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: tsouza
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/body.md" <<'EOF'
          Time for the quarterly canary exercise (SEED s§9.3, docs/seed.md).

          Author **blind canary DRAFT PRs, out-of-band** (never via repo
          automation, never announced anywhere before the verdicts land), one
          mechanical-gate flaw per PR — e.g. an illegal dep edge that must go
          red on `invariants` alone, a banned API that must go red on the
          determinism ban, a floor regression once floors are armed.

          Blind discipline:
          - DRAFT PRs (auto-merge cannot fire), ordinary titles and branch
            names, no marker of any kind until closed.
          - Each gate's catch is proven independently — one flaw per PR, never
            two in one.

          Afterwards: close both unmerged and record the outcomes in
          docs/seed.md. If either gate missed its flaw, fix the gate before
          any further loop work merges.
          EOF
          gh api "repos/${REPO}/issues" \
            -f title="Quarterly canary exercise" \
            -F body=@"${RUNNER_TEMP}/body.md" \
            -f "assignees[]=${OWNER}"
