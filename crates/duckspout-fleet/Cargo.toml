[package]
name = "duckspout-fleet"
description = "CTK distributed-run driver: boots node processes under a deterministic schedule (§8.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Bin-crate error ergonomics (s§3.3: anyhow in the four bin crates only —
# ctl, fleet, judge, loadgen).
anyhow = { workspace = true }
# The real Arrow Flight CLIENT half of §8.4's "Flight-server kill
# mid-stream" fault (issue #204, `fault::run_flight_kill_mid_stream`): the
# same generated client `duckspout-daemon/tests/flight_e2e.rs` drives the
# real server with, reused rather than hand-rolling a gRPC/Flight client.
arrow-flight = { workspace = true }
clap = { workspace = true }
# `server::TENANT_METADATA_KEY` — the real `X-Scope-OrgID` admission header
# name (§2.2), used by the drive-load driver's `--tenant` flag rather than
# hand-copying the string literal into this crate (DRY). A bin crate may
# depend on a protocol crate; only protocol×protocol edges are banned
# (ADR-0008, invariants.toml).
duckspout-accept = { workspace = true }
# Reused, not reimplemented (issue #201's own scoping note): the real node
# binary's config surface (`config::defaults`, the golden-manifest-pinned
# `LakeConfig`/`ClusterConfig`/… shapes) and its `detect_node_id` hostname
# override (`system::DUCKSPOUT_NODE_HOSTNAME_OVERRIDE`) — a fleet member's
# identity must match character-for-character what the real daemon binary
# will itself compute (`wiring.rs`'s `seed_peer_node_id` doc comment), so
# this crate depends on the daemon library to stay in lockstep with it
# rather than hand-duplicating the config surface and risking drift (DRY).
duckspout-daemon = { workspace = true }
# The frozen §3.3 action vocabulary (`TraceEvent`), for #207's cache-churn
# injector: the three post-drain residency actions it watches for in a
# node's own D-6 journal are named by their enum VARIANTS rather than by
# string literals, so this crate's watch list cannot drift from the
# vocabulary the nodes actually journal (`crate::fault`'s `RESIDENCY_EVENTS`
# doc comment). Depending on the types crate is what makes that a compile
# error instead of a silent mismatch — the same DRY reasoning as the
# `duckspout-accept` dependency above.
duckspout-types = { workspace = true }
# Concurrent per-node boot/load/shutdown fan-out (`join_all`) — the
# ecosystem-standard combinator, no in-house candidate (R-third-party-first).
futures = { workspace = true }
# The internal placeholder OTLP drive-load client (module docs of
# `load.rs`): the same real gRPC client shape
# `duckspout-daemon/tests/otlp_e2e.rs` and
# `duckspout-daemon/tests/common/capture.rs` already use, reused here rather
# than reimplemented — full load-generation semantics (retries,
# ClientAck/ClientTimeout journaling) are `duckspout-loadgen`'s own scope
# (issue #202), not duplicated here.
opentelemetry-proto = { workspace = true }
# `crate::faultlog`'s `FaultKind`/`FaultPhase`/`FaultWindowLine` derive
# `Serialize` (issue #203) — the same NDJSON-line convention
# `duckspout_loadgen::journal::LoadgenJournal` already uses.
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "process",
  "net",
  "time",
  "sync",
  "io-util",
  "fs",
] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
