[package]
name = "duckspout-accept"
description = "DuckSpout accept surface: adapter registration seam and the OTLP adapter (first implementation)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# arrow builds the fixed-schema record batches the decoder emits as IPC
# streams (compat-matrix row 1 — the same pin staging re-exports).
arrow = { workspace = true }
bytes = { workspace = true }
duckspout-types = { workspace = true }
opentelemetry-proto = { workspace = true }
# prost decodes wire payloads for the AcceptAdapter port surface (the same
# pin tonic/opentelemetry-proto ride, compat-matrix row 1).
prost = { workspace = true }
# serde_json renders OTLP attribute trees into the schema's JSON text
# columns (§4.8's fixed mapping).
serde_json = { workspace = true }
tonic = { workspace = true }
# google.rpc RetryInfo details on the UNAVAILABLE responses (§4.5, §4.6).
tonic-types = { workspace = true }

[dev-dependencies]
# §8.5's codec laws (decode → IPC round-trip, tenant-charset totality) over
# arbitrary OTLP payloads, not examples.
proptest = { workspace = true }
# The in-process gRPC tests bind an ephemeral loopback listener and stream
# it into tonic — dev-only; production sockets belong to the daemon.
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true }
# §8.6's per-PR instr-gate (ADR-0005, issue #46): deterministic
# instruction-count baseline for the Accept decode step (§4.3).
iai-callgrind = { workspace = true }

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
