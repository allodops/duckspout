[package]
name = "duckspout-staging"
description = "DuckSpout staging engine: WAL = hot over embedded DuckDB, behind the storage port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default ON since the engine landed (issue #31) — the bootstrap default-off
# deviation is over. The bundled engine compiles DuckDB's vendored C++
# (ADR-0002, disclosed cost); CI pays it once per profile and the cache holds
# it. `--no-default-features` still builds (an empty seam) so the nightly
# feature matrix (`cargo hack --each-feature`) keeps the pin honest.
default = ["duckdb"]
duckdb = ["dep:duckdb", "dep:arrow"]

[dependencies]
# arrow is the append/scan data plane (compat-matrix row 1: one arrow next to
# the pinned duckdb). Re-exported so embedders compile against the same pin.
arrow = { workspace = true, optional = true }
# appender-arrow is the pinned duckdb crate's own Arrow ingestion surface
# (Rust-side only; compiles no additional C++ beyond ADR-0002's bundled
# engine).
duckdb = { workspace = true, optional = true, features = ["appender-arrow"] }
duckspout-types = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The tests' real-filesystem Storage impl handles Bytes payloads.
bytes = { workspace = true }
# The engine's own tests drive real DuckDB files (it IS the storage here);
# the raw connection is the checkpoint-scheme control leg (#109 evidence).
duckdb = { workspace = true, features = ["appender-arrow"] }
tempfile = { workspace = true }

[lints]
workspace = true
