[package]
name = "duckspout-ctl"
description = "duckspoutctl: operator CLI for a DuckSpout cluster."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "duckspoutctl"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# `status` pretty-prints the daemon's disclosed JSON (§9.3); ctl talks to it
# over a plain blocking TCP GET (no async runtime needed for one request-
# response, so no `tokio` dependency here).
serde_json = { workspace = true }

[lints]
workspace = true
