# Own package, deliberately OUTSIDE the workspace (D-11): the root Cargo.toml
# excludes spike/, and the empty [workspace] table below is the second lock —
# cargo invoked in here never walks up into the workspace.
[package]
name = "spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
# Pin set follows compat-matrix.toml row 1 (duckdb 1.10505 wraps the stable
# C API only, ADR-0002; `bundled` compiles upstream's engine as shipped).
duckdb = { version = "1.10505", features = ["bundled"] }
anyhow = "1"
# OTLP accept path (§4.1): tonic/prost 0.14 + opentelemetry-proto 0.32 per
# compat-matrix.toml row 1 (pre-generated OTLP types, no build-time protoc).
tonic = "0.14"
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic",
    "logs",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde_json = "1"
# Flight serve leg (§7.4): arrow/arrow-flight 58 per compat-matrix.toml row 1
# — arrow 58 is what duckdb 1.10505 pins, so the engine's Arrow output and
# Flight's encoder share one type universe (the interop seam under test).
arrow = "58"
arrow-flight = "58"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
